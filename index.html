<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>象屿盈信智能客服</title>
  <style>
    :root {
      --red: #c91f25;
      --red-dark: #a3131a;
      --blue: #2458a6;
      --green: #16a06f;
      --ink: #151b24;
      --muted: #798391;
      --line: #d9dfe8;
      --wechat: #ededed;
      --white: #ffffff;
      --shadow: 0 28px 80px rgba(21, 27, 36, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, #f3f6fa 100%);
    }

    button,
    input {
      font: inherit;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .phone-shell {
      width: min(430px, calc(100vw - 24px));
      padding: 10px;
      border-radius: 28px;
      background: #1f2630;
      box-shadow: var(--shadow);
      position: relative;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      width: 102px;
      height: 20px;
      border-radius: 0 0 14px 14px;
      background: #1f2630;
      transform: translateX(-50%);
      z-index: 3;
    }

    .phone {
      height: min(820px, calc(100vh - 64px));
      min-height: 660px;
      overflow: hidden;
      border-radius: 22px;
      background: var(--wechat);
      display: flex;
      flex-direction: column;
    }

    .status-bar {
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      background: #f7f7f7;
      color: #4b5563;
      font-size: 13px;
    }

    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      height: 11px;
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
    }

    .signal i {
      width: 3px;
      display: block;
      border-radius: 2px;
      background: #4b5563;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 7px; }
    .signal i:nth-child(3) { height: 10px; }

    .battery {
      width: 23px;
      height: 12px;
      border: 1.6px solid #4b5563;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 14px;
      height: 6px;
      border-radius: 1px;
      background: #4b5563;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 6px;
      border-radius: 0 2px 2px 0;
      background: #4b5563;
    }

    .wechat-head {
      height: 58px;
      flex: 0 0 auto;
      background: #f7f7f7;
      border-bottom: 1px solid #d7d7d7;
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
    }

    .icon-btn {
      height: 58px;
      border: 0;
      background: transparent;
      color: #111827;
      display: grid;
      place-items: center;
      position: relative;
    }

    .back::before {
      content: "";
      width: 15px;
      height: 15px;
      border-left: 3px solid currentColor;
      border-bottom: 3px solid currentColor;
      transform: rotate(45deg);
      margin-left: 8px;
    }

    .person::before,
    .person::after {
      content: "";
      position: absolute;
      border: 2.5px solid currentColor;
    }

    .person::before {
      width: 16px;
      height: 16px;
      top: 13px;
      left: 18px;
      border-radius: 50%;
    }

    .person::after {
      width: 27px;
      height: 15px;
      left: 13px;
      top: 32px;
      border-top: 0;
      border-radius: 0 0 18px 18px;
    }

    .title {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      line-height: 1;
    }

    .chat {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--wechat);
      display: flex;
      flex-direction: column;
    }

    .chat-scroll {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 14px 12px;
      scroll-behavior: smooth;
    }

    .chat-scroll::-webkit-scrollbar,
    .quick-bar::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .date-line {
      text-align: center;
      color: #9ba1aa;
      font-size: 13px;
      margin: 0 0 14px;
    }

    .msg {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0 0 12px;
    }

    .msg.user {
      justify-content: flex-end;
    }

    .avatar,
    .user-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border-radius: 8px;
      display: grid;
      place-items: center;
    }

    .avatar {
      border: 1px solid #e8edf3;
      background: #fff;
      overflow: hidden;
    }

    .avatar::before {
      content: "";
      width: 17px;
      height: 24px;
      border-radius: 18px 4px 18px 4px;
      background: linear-gradient(145deg, #e7484e, var(--red));
      transform: rotate(28deg) skewY(-12deg);
    }

    .user-avatar {
      color: var(--blue);
      background: #dfe9f5;
      font-weight: 800;
    }

    .bubble {
      max-width: calc(100% - 50px);
      padding: 12px 13px;
      border-radius: 8px;
      background: #fff;
      font-size: 14px;
      line-height: 1.7;
      word-break: break-word;
      box-shadow: 0 1px 0 rgba(21, 27, 36, 0.05);
    }

    .user .bubble {
      background: #b9ec92;
      color: #13220d;
    }

    .bubble p {
      margin: 0 0 9px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .keyword-list {
      display: grid;
      gap: 5px;
      margin: 9px 0;
    }

    .keyword-line {
      display: grid;
      grid-template-columns: 75px 1fr;
      gap: 6px;
      line-height: 1.5;
    }

    .keyword-line b {
      color: var(--blue);
      white-space: nowrap;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 8px;
      padding: 3px 7px;
      color: var(--blue);
      background: #eef4ff;
      font-size: 11px;
      font-weight: 800;
    }

    .handoff-box {
      border: 1px solid #efc5c7;
      background: #fff3f3;
      color: #6d1f1f;
      padding: 10px;
      border-radius: 8px;
      margin-top: 9px;
    }

    .handoff-box strong {
      color: var(--red-dark);
    }

    .quick-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 10px 10px;
      border-top: 1px solid #dddddd;
      background: var(--wechat);
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid #d6dfeb;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .composer {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 62px;
      gap: 8px;
      padding: 10px;
      background: #f7f7f7;
      border-top: 1px solid #dadada;
    }

    .composer input {
      width: 100%;
      min-width: 0;
      border: 1px solid #d4dce7;
      border-radius: 8px;
      outline: 0;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }

    .composer input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(36, 88, 166, 0.13);
    }

    .send {
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
    }

    .bottom-menu {
      height: 72px;
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 52px repeat(3, minmax(0, 1fr));
      border-top: 1px solid #dcdcdc;
      background: #f8f8f8;
    }

    .keyboard {
      border-right: 1px solid #dedede;
      display: grid;
      place-items: center;
    }

    .keyboard::before {
      content: "";
      width: 30px;
      height: 30px;
      border: 2.4px solid #111827;
      border-radius: 50%;
      background:
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 7px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 15px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 23px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 7px 16px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 15px 16px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 23px 16px / 8px 8px;
      background-repeat: no-repeat;
    }

    .menu-item {
      min-width: 0;
      border: 0;
      border-right: 1px solid #dedede;
      background: transparent;
      color: #111827;
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 8px;
      font-weight: 800;
    }

    .menu-item:last-child {
      border-right: 0;
    }

    .menu-item span:first-child {
      justify-self: center;
      white-space: nowrap;
      font-size: 16px;
    }

    .menu-mark {
      color: #9aa1ab;
      font-size: 12px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      min-width: 42px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ba1aa;
      animation: bounce 0.9s infinite ease-in-out;
    }

    .typing i:nth-child(2) { animation-delay: 0.15s; }
    .typing i:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
      40% { transform: translateY(-4px); opacity: 1; }
    }

    @media (max-width: 520px) {
      .page {
        padding: 6px;
      }

      .phone-shell {
        width: 360px;
        max-width: calc(100vw - 12px);
        padding: 6px;
        border-radius: 20px;
      }

      .phone {
        height: calc(100vh - 12px);
        min-height: 650px;
        border-radius: 16px;
      }

      .bubble {
        font-size: 13px;
      }

      .keyword-line {
        grid-template-columns: 68px 1fr;
      }

      .menu-item {
        padding: 0 3px;
      }

      .menu-item span:first-child {
        font-size: 14px;
      }

      .menu-mark {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="phone-shell" aria-label="象屿盈信公众号智能客服">
      <div class="phone">
        <div class="status-bar">
          <span></span>
          <strong>09:41</strong>
          <span class="status-icons" aria-hidden="true">
            <span class="signal"><i></i><i></i><i></i></span>
            <span>5G</span>
            <span class="battery"></span>
          </span>
        </div>
        <div class="wechat-head">
          <button class="icon-btn back" type="button" aria-label="返回"></button>
          <div class="title">象屿盈信</div>
          <button class="icon-btn person" type="button" aria-label="账户"></button>
        </div>
        <div class="chat">
          <div class="chat-scroll" id="chat"></div>
          <div class="quick-bar" id="quickBar"></div>
          <form class="composer" id="composer">
            <input id="userInput" autocomplete="off" placeholder="请输入您的问题" />
            <button class="send" type="submit">发送</button>
          </form>
        </div>
        <nav class="bottom-menu" aria-label="公众号底部菜单">
          <div class="keyboard" aria-hidden="true"></div>
          <button class="menu-item" type="button" data-menu="党建引领"><span>党建引领</span><span class="menu-mark">▾</span></button>
          <button class="menu-item" type="button" data-menu="业务办理"><span>业务办理</span><span class="menu-mark">⌕</span></button>
          <button class="menu-item" type="button" data-menu="客服中心"><span>客服中心</span><span class="menu-mark">≡</span></button>
        </nav>
      </div>
    </section>
  </main>

  <script>
    const state = {
      knowledge: [],
      lastMatch: null,
      collected: { name: false, plate: false, phone: false },

    const els = {
      chat: document.getElementById("chat"),
      quickBar: document.getElementById("quickBar"),

    const quickPrompts = [
      "你好",

      "查账单还剩几期",
      "提前结清多少钱",
      "结清后怎么解押",

    const hardHandoffRules = [
      { terms: ["人工", "真人", "转人工", "人工客服"], reason: "客户明确要求人工服务" },
      { terms: ["投诉", "举报", "态度差", "没人处理", "催收争议"], reason: "投诉或服务争议" },
      { terms: ["减免", "少收", "能不能免", "免掉"], reason: "涉及费用减免审批" },
      { terms: ["多少钱", "金额", "尾款", "全款多少", "结清试算", "费用高", "滞纳金多少", "罚息多少"], reason: "涉及具体金额核算" },
      { terms: ["已扣款", "扣了", "没到账", "未入账", "账单没更新", "重复扣款"], reason: "可能存在账务或系统异常" },
      { terms: ["打不开", "系统异常", "页面异常", "无法提交", "12123无法", "车管所说不能"], reason: "系统、页面或车管所反馈异常" },
      { terms: ["车被拖走", "拖车", "法务", "公证", "解除合同"], reason: "涉及法务、拖车或严重违约事项" },
      { terms: ["退费", "退款", "重开", "作废", "抬头错", "税号错"], reason: "涉及财务异常或票据更正" },
      { terms: ["车在哪里", "定位查询", "查定位", "gps当前位置"], reason: "定位信息涉及隐私和风险核实" },
      { terms: ["材料丢", "寄错", "快递异常", "急用"], reason: "材料或快递异常需要人工跟进" },
    ];

    const businessWords = [
      "还款", "账单", "扣款", "代扣", "还款卡", "银行卡", "结清", "提前还", "全款", "尾款",
      "解押", "解除抵押", "云解押", "12123", "绿本", "大本", "登记证", "发票", "开票",
      "抬头", "税号", "材料", "快递", "钥匙", "结清证明", "逾期", "延期", "宽限期",
      "滞纳金", "罚息", "减免", "GPS", "定位", "车辆", "车牌", "过户", "卖车",
      "保险", "年检", "费用", "收费", "人工", "客服", "投诉", "法务", "公证", "拖车", "系统异常",
    ];

    const generalReplies = [
      {
        type: "问候",
        patterns: [/^(你好|您好|哈喽|hello|hi|嗨|在吗|在不在|有人吗)$/i, /^(早上好|上午好|中午好|下午好|晚上好)$/],
        reply: () => `

        `,
      },
      {
        type: "身份说明",
        patterns: [/你是谁|你是什么|机器人吗|是真人吗|是不是人工|你能干嘛|你可以做什么|有什么功能|怎么用/],
        reply: () => `

      },
      {
        type: "感谢",
        patterns: [/谢谢|感谢|辛苦了|麻烦你了|多谢|好的谢谢|收到谢谢/],
        reply: () => `
          <p>不客气，很高兴能帮到您。</p>
          <p>后续如果还需要查询账单、办理结清解押、申请发票或联系人工客服，可以继续在这里留言。</p>

      },
      {
        type: "确认",
        patterns: [/^(好的|好|嗯|嗯嗯|知道了|明白了|收到|可以|行|OK|ok)$/],
        reply: () => `
          <p>好的。</p>
          <p>如果您要继续办理业务，请直接描述具体事项；如果需要工作人员核实，请尽量补充姓名、车牌号和联系电话，方便后续对接。</p>
        `,
      },
      {
        type: "告别",
        patterns: [/再见|拜拜|回头再说|没事了|不用了|先这样/],
        reply: () => `
          <p>好的，感谢您的咨询。</p>
          <p>后续如有还款、结清、解押、发票或其他售后问题，您可以随时再进入公众号客服咨询。</p>
        `,
      },
      {
        type: "安抚",
        patterns: [/着急|很急|烦|生气|无语|不满意|太慢了|一直没人|怎么还没处理/],
        reply: () => `
          <p>理解您的心情，给您带来不便非常抱歉。</p>
          <p>为了尽快判断处理路径，请您补充一下具体事项，以及姓名、车牌号和联系电话。若涉及投诉、账务异常、材料急用或系统问题，我会按转人工核实的方式处理。</p>
        `,
      },
      {
        type: "人工入口",
        patterns: [/人工服务时间|客服电话|电话多少|怎么联系你们|客服热线|联系方式/],
        reply: () => `
          <p>客服热线：0592-5661616。</p>
          <p>人工服务时间为周一至周五 9:00-12:00、14:00-18:00，节假日除外。若当前不在人工服务时段，您可以先留下姓名、车牌号、联系电话和问题描述，工作人员会按顺序跟进。</p>
        `,
      },
      {
        type: "非业务闲聊",
        patterns: [/天气|讲个笑话|你会聊天吗|你聪明吗|你叫什么|陪我聊|心情不好|测试一下/],
        reply: () => `
          <p>我在的，可以简单陪您聊两句，不过我主要负责象屿盈信售后业务咨询。</p>
          <p>如果您有合同、还款、结清、解押、发票、材料、逾期或车辆相关问题，直接告诉我，我会按知识库给您更准确的答复。</p>
        `,
      },
    ];

    const actionHints = [
      { test: (row) => row.category === "还款类" && row.issue.includes("账单"), text: "下一步可点击底部【业务办理】进入【还款/账单】页面查看账单、还款计划和已还期数。" },
      { test: (row) => row.category === "还款类" && row.issue.includes("失败"), text: "建议先核对银行卡余额、限额、冻结状态和绑定卡是否变更；如已扣款未入账，需要人工核对凭证。" },
      { test: (row) => row.category === "结清类" && row.issue.includes("金额"), text: "结清金额不能直接由机器人承诺，需要系统试算并由工作人员确认最终金额。" },
      { test: (row) => row.category === "结清类" && row.issue.includes("费用"), text: "请先确认费用发生在结清前、结清试算中还是结清后；涉及多收、退费、减免或费用争议时，需要人工结合合同和系统记录核实。" },
      { test: (row) => row.category === "结清类", text: "结清类问题通常需要核实姓名、车牌号和联系电话，确认款项、材料、结清文件和解押节点。" },
      { test: (row) => row.category === "解押类" && row.issue.includes("费用"), text: "请先确认办理方式是云解押、线下本人办理还是第三方代办；不同地区车管所要求可能不同，费用争议需人工核实。" },
      { test: (row) => row.category === "解押类", text: "如符合云解押条件，请在【交管12123】APP：首页→更多→机动车业务→解除抵押中确认；页面异常时请截图。" },
      { test: (row) => row.category === "发票类", text: "请先明确发票类型、抬头、税号、车牌号和联系方式；金额、主体或重开作废需要人工核实。" },
      { test: (row) => row.category === "材料类", text: "材料问题建议先补齐姓名、车牌号、联系电话、收件地址或快递信息，便于工作人员查件。" },
      { test: (row) => row.category === "逾期类", text: "逾期相关问题请优先安排还款；涉及协商、减免、严重逾期或车辆处置时必须人工核实。" },
      { test: (row) => row.category === "GPS/车辆类", text: "GPS和车辆状态涉及隐私、合同状态或车辆风险，机器人只做流程引导，敏感查询需人工核实身份。" },
      { test: (row) => row.category === "人工服务类", text: "人工服务时间为周一至周五 9:00-12:00、14:00-18:00，节假日除外。" },
    ];

    const categorySignals = {
      "还款类": ["还款", "还钱", "月供", "扣款", "代扣", "银行卡", "还款卡", "账单", "明细", "几期", "多少期", "还款计划", "余额", "主动还"],
      "结清类": ["结清", "提前结清", "提前还", "一次性", "全款", "尾款", "还清", "不想分期", "结清款", "结清金额", "转款", "结清费用", "多收", "费用争议", "绿本", "大本"],
      "解押类": ["解押", "解除抵押", "抵押", "云解押", "12123", "车管所", "批注", "登记证", "绿本解押", "解押费", "解押收费", "代办费"],
      "发票类": ["发票", "开票", "电子票", "月租发票", "GPS发票", "公证费发票", "服务费发票", "抬头", "税号", "重开", "作废"],
      "材料类": ["材料", "资料", "补件", "上传", "照片", "快递", "寄送", "单号", "地址", "钥匙", "结清证明", "委托书"],
      "逾期类": ["逾期", "晚还", "宽限期", "延期", "协商", "滞纳金", "罚息", "严重逾期", "收车", "拖车", "法务", "公证"],
      "GPS/车辆类": ["GPS", "定位", "安装位置", "拆除", "车辆", "车在哪里", "保险", "年检", "过户", "卖车", "转让"],
      "人工服务类": ["人工", "真人", "客服", "电话", "热线", "联系", "回电", "打不通", "投诉", "举报"],
    };

    init();

    async function init() {
      renderQuickPrompts();
      appendDate();
      try {
        const response = await fetch("knowledge.json", { cache: "no-store" });
        const payload = await response.json();
        state.knowledge = payload.rows;
        appendBot(welcomeHtml(payload), { category: "欢迎语", issue: "客服入口" });

        const ask = new URLSearchParams(window.location.search).get("ask");
        if (ask) {
          setTimeout(() => {
            els.userInput.value = ask;
            sendUserMessage();
          }, 450);
        }
      } catch (error) {
        appendBot("<p>知识库加载失败，请刷新页面重试。</p>");
      }
    }

    function welcomeHtml(payload) {
      return `
        <p><strong>您好，欢迎关注象屿盈信。</strong></p>
        <p>您可以直接输入售后问题，例如“我要还款”“提前结清多少钱”“结清后怎么解押”“GPS装在哪里”。</p>
        <p>我已接入 ${payload.total} 条售后知识库内容，会根据您的描述自动回复；涉及金额、减免、投诉、系统异常等情况，会先收集关键信息并引导转人工核实。</p>
        <div class="keyword-list">
          <div class="keyword-line"><b>【还款】</b><span>还款方式、扣款时间、账单信息</span></div>
          <div class="keyword-line"><b>【结清】</b><span>提前结清、金额试算、材料进度</span></div>
          <div class="keyword-line"><b>【解押】</b><span>云解押、线下解押、12123路径</span></div>
          <div class="keyword-line"><b>【发票】</b><span>月租、GPS费、公证费等发票</span></div>
          <div class="keyword-line"><b>【人工】</b><span>联系工作人员协助处理</span></div>
        </div>
      `;
    }

    function renderQuickPrompts() {
      els.quickBar.innerHTML = quickPrompts
        .map((text) => `<button class="chip" type="button">${escapeHtml(text)}</button>`)
        .join("");
      els.quickBar.querySelectorAll(".chip").forEach((button) => {
        button.addEventListener("click", () => {
          els.userInput.value = button.textContent;
          sendUserMessage();
        });
      });
    }

    function appendDate() {
      const line = document.createElement("div");
      line.className = "date-line";
      line.textContent = "智能客服";
      els.chat.appendChild(line);
    }

    function appendBot(html, match = null, handoff = null) {
      removeTyping();
      const row = document.createElement("div");
      row.className = "msg bot";
      const meta = "";
      row.innerHTML = `<div class="avatar" aria-hidden="true"></div><div class="bubble">${html}${meta}</div>`;
      els.chat.appendChild(row);
      scrollBottom();
    }

    function appendUser(text) {
      const row = document.createElement("div");
      row.className = "msg user";
      row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div><div class="user-avatar" aria-hidden="true">客</div>`;
      els.chat.appendChild(row);
      scrollBottom();
    }

    function showTyping() {
      removeTyping();
      const row = document.createElement("div");
      row.className = "msg bot typing-row";
      row.innerHTML = `<div class="avatar" aria-hidden="true"></div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div>`;
      els.chat.appendChild(row);
      scrollBottom();
    }

    function removeTyping() {
      const old = els.chat.querySelector(".typing-row");
      if (old) old.remove();
    }

    function scrollBottom() {
      els.chat.scrollTop = els.chat.scrollHeight;
      setTimeout(() => {
        els.chat.scrollTop = els.chat.scrollHeight;
      }, 30);
      setTimeout(() => {
        els.chat.scrollTop = els.chat.scrollHeight;
      }, 180);
    }

    els.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendUserMessage();
    });

    document.querySelectorAll(".menu-item").forEach((button) => {
      button.addEventListener("click", () => {
        const name = button.dataset.menu;
        appendUser(`点击菜单：${name}`);
        showTyping();
        setTimeout(() => {
          if (name === "业务办理") {
            appendBot("<p>您已进入【业务办理】。常用入口包括还款/账单、结清进度、资料变更、发票申请等。您也可以直接输入想办理的业务，我会帮您匹配。</p>");
          } else if (name === "客服中心") {
            appendBot("<p>客服中心可处理常见问题、网点查询、人工登记等。您可以直接回复【人工】或描述具体问题。</p>");
          } else {
            appendBot("<p>党建引领栏目保持原有入口不变。本页面主要模拟智能客服聊天能力，请继续输入售后业务问题。</p>");
          }
        }, 420);
      });
    });

    function sendUserMessage() {
      const text = els.userInput.value.trim();
      if (!text) return;
      els.userInput.value = "";
      appendUser(text);
      updateCollectedInfo(text);
      showTyping();
      setTimeout(() => {
        const result = answer(text);
        appendBot(result.html, result.match, result.handoff);
      }, 520);
    }

    function answer(text) {
      const ranked = findBestMatches(text);
      const match = ranked[0];
      const general = findGeneralReply(text);
      if (general && !isBusinessIntent(text, match)) {
        return {
          html: general.reply(),
          match: { category: "智能客服", issue: general.type },
          handoff: null,
        };
      }

      if (!isConfidentMatch(text, ranked)) {
        if (isBusinessIntent(text, match)) {
          return {
            html: clarificationAnswer(text, ranked),
            match: { category: "业务澄清", issue: "避免答偏" },
            handoff: null,
          };
        }

        return {
          html: general ? general.reply() : fallbackAnswer(text),
          match: { category: "智能客服", issue: general ? general.type : "请补充问题" },
          handoff: null,
        };
      }

      const handoff = detectHandoff(text, match.row);
      const isFollow = state.lastMatch && state.lastMatch.id === match.row.id && isFollowUp(text);
      state.lastMatch = match.row;

      const parts = [];
      parts.push(`<p>${escapeHtml(isFollow && match.row.followReply ? match.row.followReply : match.row.firstReply)}</p>`);

      const hint = inferAction(match.row);
      if (hint) parts.push(`<p><strong>下一步建议：</strong>${escapeHtml(hint)}</p>`);

      if (handoff) {
        parts.push(`
          <div class="handoff-box">
            <p><strong>这个情况建议转人工核实。</strong></p>
            <p>原因：${escapeHtml(handoff.reason)}。</p>
            <p>${escapeHtml(infoRequest(match.row, text))}</p>
          </div>
        `);
      } else if (match.row.handoff) {
        parts.push(`<p>如果出现“${escapeHtml(match.row.handoff)}”这类情况，我会为您登记人工核实。</p>`);
      }

      const collected = collectedText();
      if (collected) parts.push(`<p>${escapeHtml(collected)}</p>`);

      return { html: parts.join(""), match: match.row, handoff };
    }

    function findGeneralReply(text) {
      return generalReplies.find((item) => item.patterns.some((pattern) => pattern.test(text.trim())));
    }

    function isBusinessIntent(text, match) {
      const normalized = normalize(text);
      const hasBusinessWord = businessWords.some((word) => normalized.includes(normalize(word)));
      const hasKnowledgeKeyword = state.knowledge.some((row) =>
        (row.triggers || row.keywords || []).some((keyword) => {
          const key = normalize(keyword);
          return key.length >= 2 && normalized.includes(key);
        }),
      );

      if (hasBusinessWord || hasKnowledgeKeyword) return true;
      if (match && match.score >= 7) return true;
      if (state.lastMatch && isFollowUp(text) && !findGeneralReply(text)) return true;
      return false;
    }

    function findBestMatches(text) {
      const normalized = normalize(text);
      const categoryScore = getCategoryScores(normalized);
      const scored = [];

      for (const row of state.knowledge) {
        let score = categoryScore[row.category] || 0;
        let strongHit = false;
        let hitCount = 0;

        for (const keyword of row.keywords || []) {
          const hit = scorePhrase(normalized, keyword, "keyword");
          score += hit.score;
          if (hit.strong) strongHit = true;
          if (hit.score > 0) hitCount += 1;
        }

        for (const question of row.questions || []) {
          const hit = scorePhrase(normalized, question, "question");
          score += hit.score;
          if (hit.strong) strongHit = true;
          if (hit.score > 0) hitCount += 1;
        }

        for (const token of [...(row.issueTerms || []), ...issueTokens(row.issue)]) {
          const hit = scorePhrase(normalized, token, "issue");
          score += hit.score;
          if (hit.strong) strongHit = true;
          if (hit.score > 0) hitCount += 1;
        }

        if (normalized.includes(normalize(row.category.replace("类", "")))) score += 2;
        if (state.lastMatch && state.lastMatch.category === row.category && isFollowUp(text)) score += 1.5;
        if (state.lastMatch && state.lastMatch.id === row.id && isFollowUp(text)) score += 3;

        if (score > 0) scored.push({ row, score, strongHit, hitCount });
      }

      return scored.sort((a, b) => b.score - a.score);
    }

    function getCategoryScores(normalized) {
      const scores = {};
      for (const [category, terms] of Object.entries(categorySignals)) {
        for (const term of terms) {
          const key = normalize(term);
          if (!key) continue;
          if (normalized.includes(key)) {
            scores[category] = (scores[category] || 0) + (key.length >= 3 ? 2.5 : 1.4);
          }
        }
      }
      return scores;
    }

    function scorePhrase(normalized, phrase, kind) {
      const key = normalize(phrase);
      if (!key || key.length < 2) return { score: 0, strong: false };

      const weight = kind === "question" ? 1.15 : kind === "keyword" ? 1 : 0.8;
      if (normalized === key) return { score: 24 * weight, strong: true };

      if (normalized.includes(key)) {
        const base = key.length <= 2 ? 5 : key.length <= 4 ? 8 : 11;
        return { score: (base + Math.min(key.length, 10) * 0.45) * weight, strong: key.length >= 3 };
      }

      if (key.includes(normalized) && normalized.length >= 4) {
        return { score: (7 + Math.min(normalized.length, 8) * 0.35) * weight, strong: normalized.length >= 5 };
      }

      const sim = phraseSimilarity(normalized, key);
      if (normalized.length >= 5 && key.length >= 5 && sim >= 0.72) {
        return { score: 10 * weight, strong: true };
      }
      if (normalized.length >= 6 && key.length >= 6 && sim >= 0.58) {
        return { score: 5.5 * weight, strong: false };
      }

      return { score: 0, strong: false };
    }

    function phraseSimilarity(a, b) {
      const aGrams = grams(a);
      const bGrams = grams(b);
      if (!aGrams.length || !bGrams.length) return 0;
      const bCounts = new Map();
      bGrams.forEach((gram) => bCounts.set(gram, (bCounts.get(gram) || 0) + 1));
      let overlap = 0;
      for (const gram of aGrams) {
        const count = bCounts.get(gram) || 0;
        if (count > 0) {
          overlap += 1;
          bCounts.set(gram, count - 1);
        }
      }
      return (2 * overlap) / (aGrams.length + bGrams.length);
    }

    function grams(value) {
      if (value.length <= 2) return [value];
      const result = [];
      for (let i = 0; i < value.length - 1; i += 1) {
        result.push(value.slice(i, i + 2));
      }
      return result;
    }

    function isConfidentMatch(text, ranked) {
      const match = ranked[0];
      if (!match) return false;
      const second = ranked[1];
      if (match.strongHit && match.score >= 8) return true;
      if (match.score >= 18) return true;
      if (match.score >= 12 && (!second || match.score - second.score >= 3 || second.row.category === match.row.category)) return true;
      if (match.score >= 9 && match.hitCount >= 2 && (!second || match.score - second.score >= 2.5)) return true;
      return false;
    }

    function clarificationAnswer(text, ranked) {
      const candidates = [];
      const seen = new Set();
      for (const item of ranked) {
        if (item.score < 3 || seen.has(item.row.issue)) continue;
        seen.add(item.row.issue);
        candidates.push(item.row);
        if (candidates.length >= 3) break;
      }

      if (!candidates.length) {
        return `
          <p>我理解您是在咨询售后业务，但目前信息还不够明确。</p>
          <p>请您补充一下具体问题，例如是还款、账单、结清、解押、发票、材料、逾期、GPS，还是需要人工客服。</p>
        `;
      }

      return `
        <p>为了避免答偏，请您确认一下想咨询的是哪一类问题：</p>
        ${candidates.map((row, index) => `<p>${index + 1}. ${escapeHtml(row.issue)}</p>`).join("")}
        <p>您可以直接回复上面的事项名称，或再补充一句具体情况，我会再给您对应回复。</p>
      `;
    }

    function issueTokens(issue) {
      return issue
        .replace(/[\/（）()]/g, " ")
        .split(/\s+/)
        .map((item) => item.trim())
        .filter((item) => item.length >= 2);
    }

    function detectHandoff(text, row) {
      const normalized = normalize(text);
      for (const rule of hardHandoffRules) {
        if (rule.terms.some((term) => normalized.includes(normalize(term)))) {
          return { reason: rule.reason };
        }
      }

      const handoffTerms = row.handoff
        .replace(/[。；;,，、]/g, "|")
        .split("|")
        .map((item) => item.trim())
        .filter((item) => item.length >= 3 && !item.includes("一律"));

      for (const term of handoffTerms) {
        const core = normalize(term.replace("客户", "").replace("要求", "").replace("涉及", ""));
        if (core && (normalized.includes(core) || core.includes(normalized))) {
          return { reason: term };
        }
      }

      if (row.handoff.includes("一律转人工")) {
        const strongTerms = ["金额", "减免", "代偿", "异常", "责任", "定位", "投诉", "争议"];
        if (strongTerms.some((term) => normalized.includes(normalize(term)) || normalize(row.issue + row.handoff).includes(normalize(term)))) {
          return { reason: row.handoff };
        }
      }

      return null;
    }

    function inferAction(row) {
      const item = actionHints.find((hint) => hint.test(row));
      return item ? item.text : row.followReply || "";
    }

    function infoRequest(row, text) {
      const base = ["请留下姓名", "车牌号", "联系电话"];
      const normalized = normalize(row.issue + row.handoff + text);
      if (normalized.includes("截图") || normalized.includes("12123") || normalized.includes("系统") || normalized.includes("扣款") || normalized.includes("未入账")) {
        base.push("相关截图或凭证");
      }
      if (normalized.includes("发票") || normalized.includes("抬头") || normalized.includes("税号")) {
        base.push("发票类型/抬头/税号");
      }
      if (normalized.includes("材料") || normalized.includes("快递") || normalized.includes("寄")) {
        base.push("收件地址或快递信息");
      }
      if (normalized.includes("gps") || normalized.includes("定位")) {
        base.push("查询原因");
      }
      return `${base.join("、")}，工作人员会结合合同和系统记录进一步核实。`;
    }

    function fallbackAnswer(text) {
      const last = state.lastMatch;
      if (last && isFollowUp(text)) {
        return `
          <p>我理解您是在继续咨询【${escapeHtml(last.issue)}】。${escapeHtml(last.followReply || last.firstReply)}</p>
          <p>为了更准确处理，请您再补充一下：您现在是想查询进度、办理流程，还是遇到了系统、金额或材料异常？</p>
        `;
      }

      return `
        <p>我在的。这个问题我还需要您说得更具体一些，才能帮您准确判断。</p>
        <p>您可以直接描述要办理的事项，或回复关键词：还款、账单、结清、解押、发票、材料、逾期、GPS、人工。</p>
        <p>如果涉及合同、账务、车辆或材料，请尽量补充姓名、车牌号和联系电话，便于工作人员后续核实。</p>
      `;
    }

    function updateCollectedInfo(text) {
      if (/姓名|我是|我叫|先生|女士/.test(text)) state.collected.name = true;
      if (/[京津沪渝冀豫云辽黑湘皖鲁新苏浙赣鄂桂甘晋蒙陕吉闽贵粤青藏川宁琼][A-Z0-9][A-Z0-9·.-]{4,7}/i.test(text) || /车牌/.test(text)) state.collected.plate = true;
      if (/1[3-9]\d{9}/.test(text) || /电话|手机号|联系方式/.test(text)) state.collected.phone = true;
    }

    function collectedText() {
      const missing = [];
      if (!state.collected.name) missing.push("姓名");
      if (!state.collected.plate) missing.push("车牌号");
      if (!state.collected.phone) missing.push("联系电话");
      if (missing.length === 3) return "";
      if (missing.length === 0) return "您提供的姓名、车牌号和联系电话已较完整，后续可进入人工核实或业务登记。";
      return `我已记录到部分信息，如需人工核实，还差：${missing.join("、")}。`;
    }

    function isFollowUp(text) {
      return /那|还|怎么|多久|多少|为什么|可以|能不能|哪里|入口|需要|然后|下一步|没找到|不行|怎么办|呢/.test(text) || text.length <= 8;
    }

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/\s/g, "")
        .replace(/[，。？！、,.!?;；:：'"“”‘’（）()【】\[\]<>《》-]/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
